name: Release Packages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-installer:
    name: Windows NSIS installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13'
          cache: npm
          cache-dependency-path: electron/package-lock.json
      - uses: actions/setup-go@v6
        with:
          go-version: '1.22.x'
          cache: false
      - working-directory: electron
        run: npm ci
      - name: Build old and current Windows installer fixtures
        working-directory: electron
        run: npm run package:win:smoke-fixtures
      - name: Run Windows install, upgrade, and uninstall host smoke
        working-directory: electron
        shell: pwsh
        run: |
          $fixtures = Get-Content ../release/installer-smoke/fixtures.json -Raw | ConvertFrom-Json
          $smokeRoot = Join-Path $env:RUNNER_TEMP "yuizaki-installer-smoke-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          node scripts/windows-installer-smoke.mjs `
            --old-installer $fixtures.oldInstaller `
            --new-installer $fixtures.newInstaller `
            --temp-root $smokeRoot `
            --temporary-base $env:RUNNER_TEMP `
            --launch-timeout-ms 12000 `
            --evidence ../release/installer-smoke/windows-host-evidence.json
      - name: Upload current Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: yuizaki-windows-installer
          path: |
            release/installer-smoke/new/*.exe
            release/installer-smoke/new/*.blockmap
          if-no-files-found: error
      - name: Upload Windows installer smoke evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yuizaki-windows-installer-smoke-evidence
          path: |
            release/installer-smoke/old/*.exe
            release/installer-smoke/old/*.blockmap
            release/installer-smoke/fixtures.json
            release/installer-smoke/windows-host-evidence.json
          if-no-files-found: warn

  linux-packages:
    name: Linux AppImage and deb
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13'
          cache: npm
          cache-dependency-path: electron/package-lock.json
      - uses: actions/setup-go@v6
        with:
          go-version: '1.22.x'
          cache: false
      - name: Install Linux packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby-full
          sudo gem install --no-document fpm
      - working-directory: electron
        run: npm ci
      - working-directory: electron
        run: npm run package:linux
      - uses: actions/upload-artifact@v4
        with:
          name: yuizaki-linux-packages
          path: |
            YuizakiLauncher
            release/*.AppImage
            release/*.deb
