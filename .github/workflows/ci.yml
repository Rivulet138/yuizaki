name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  documentation:
    name: Documentation Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check_docs.py
      - name: Validate model resource lock
        run: python scripts/check_resources.py
      - name: Validate Python dependency lock matrix
        working-directory: python
        run: python scripts/check_requirements_lock.py

  electron-build:
    name: Electron Validate & Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: electron
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.13'
          cache: 'npm'
          cache-dependency-path: electron/package-lock.json

      - uses: actions/setup-python@v5
        if: runner.os == 'Linux'
        with:
          python-version: '3.12'

      - run: npm ci
      - run: npm run install:runtime
      - run: npm run start:check
      - run: npm run type-check
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Validate Linux launch scripts
        if: runner.os == 'Linux'
        working-directory: ${{ github.workspace }}
        run: bash -n install_core.sh install_full.sh start.sh start_soulx_svc.sh scripts/check_linux_environment.sh scripts/run_backend_dev.sh scripts/smoke_linux_electron.sh
      - name: Install Linux GUI runtime libraries
        if: runner.os == 'Linux'
        working-directory: ${{ github.workspace }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libxtst6 xvfb xauth
          sudo chown root electron/node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 electron/node_modules/electron/dist/chrome-sandbox
      - name: Smoke test Linux Electron GUI
        if: runner.os == 'Linux'
        working-directory: ${{ github.workspace }}
        run: xvfb-run -a env PYTHON_BIN=python scripts/smoke_linux_electron.sh

  node-mcp-test:
    name: Node MCP Test (Linux)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: node-mcp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.13'
          cache: 'npm'
          cache-dependency-path: node-mcp/package-lock.json

      - run: npm ci
      - run: npm test

  python-test:
    name: Python Lint & Test (3.12 / 3.13)
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: python/requirements-dev-lock-linux.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev-lock-linux.txt
          pip check
          python scripts/check_installed_lock.py --lock requirements-dev-lock-linux.txt

      - name: Check Python runtime errors with ruff
        run: ruff check . --select E9,F63,F7,F82

      - name: Type check with pyright
        run: pyright --pythonversion ${{ matrix.python-version }}

      - name: Run tests
        run: pytest -q --tb=short

      - name: Run offline model evaluation smoke suite
        run: python -m evals --output artifacts/model-evaluation-${{ matrix.python-version }}.json

      - name: Upload model evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-evaluation-${{ matrix.python-version }}
          path: python/artifacts/model-evaluation-${{ matrix.python-version }}.json
          if-no-files-found: warn
