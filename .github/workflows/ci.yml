name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  documentation:
    name: Documentation Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - run: python scripts/check_docs.py
      - name: Validate model resource lock
        run: python scripts/check_resources.py
      - name: Validate Python dependency lock matrix
        working-directory: python
        run: python scripts/check_requirements_lock.py

  python-contracts:
    name: Python Companion Contracts (Python ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install locked test dependencies
        working-directory: python
        run: python -m pip install -r requirements-test-lock-linux.txt
      - name: Run deterministic memory replay gate
        run: python scripts/memory_retrieval_check.py
      - name: Run local stream staging replay gate
        run: python scripts/stream_staging_check.py
      - name: Run local connector staging replay gate
        run: python scripts/connector_staging_check.py
      - name: Run synthetic voice comfort replay gate
        run: python scripts/voice_comfort_check.py
      - name: Run full Python regression suite
        env:
          PYTHONPATH: python
        run: python -m pytest -q
      - name: Verify fail-closed platform release CLI
        run: |
          set +e
          python scripts/platform_release_check.py --target-platform windows > /tmp/release-readiness.json
          status=$?
          set -e
          test "$status" -eq 2
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('/tmp/release-readiness.json').read_text(encoding='utf-8'))
          assert report['status'] == 'not_qualified'
          assert report['claim'] == 'must_not_be_used_as_release_qualification'
          PY
      - name: Compile Python source and contracts
        run: >-
          python -m compileall -q
          python/app.py
          python/socket_server.py
          python/modules
          python/routes
          python/socket_handlers
          python/tests

  python-type-check:
    name: Python Type Check (Python ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install locked development dependencies
        working-directory: python
        run: python -m pip install -r requirements-dev-lock-linux.txt
      - name: Run basedpyright
        run: basedpyright --pythonversion ${{ matrix.python-version }}

  electron-build:
    name: Electron Validate & Build (${{ matrix.os }}, Node ${{ matrix.node-version }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        node-version: ['22.13', '24.x']
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: electron
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: electron/package-lock.json

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        if: runner.os == 'Linux'
        with:
          python-version: '3.12'

      - run: npm ci
      - name: Audit npm dependencies
        run: npm audit --audit-level=low
      - run: npm run install:runtime
      - run: npm run type-check
      - run: npm run lint
      - run: npm run test:unit
      # i18n ratchet: fails when hardcoded Chinese grows in the renderer. Lower
      # the budget as panels move to t(); the unit tests already enforce key
      # parity for every message module.
      - name: Audit i18n coverage
        if: runner.os == 'Linux'
        working-directory: ${{ github.workspace }}
        run: python scripts/i18n_inventory.py --max-cjk 19
      - run: npm run build
      - run: npm run start:check
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        if: runner.os == 'Windows'
        with:
          go-version: '1.27.x'
          cache: false
      - name: Test Windows launcher
        if: runner.os == 'Windows'
        working-directory: ${{ github.workspace }}/tools/yuizaki-launcher
        run: go test ./...

  node-mcp:
    name: node-mcp Contract Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: node-mcp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.13'
          cache: npm
          cache-dependency-path: node-mcp/package-lock.json
      - run: npm ci
      - run: npm test
