name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  electron-build:
    name: Electron Validate & Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: electron
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.13'
          cache: 'npm'
          cache-dependency-path: electron/package-lock.json

      - uses: actions/setup-python@v5
        if: runner.os == 'Linux'
        with:
          python-version: '3.12'

      - run: npm ci
      - run: npm run install:runtime
      - run: npm run start:check
      - run: npm run type-check
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Validate Linux launch scripts
        if: runner.os == 'Linux'
        working-directory: ${{ github.workspace }}
        run: bash -n install_core.sh install_full.sh start.sh start_soulx_svc.sh scripts/check_linux_environment.sh scripts/run_backend_dev.sh scripts/smoke_linux_electron.sh
      - name: Install Linux GUI runtime libraries
        if: runner.os == 'Linux'
        working-directory: ${{ github.workspace }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libxtst6 xvfb xauth
          sudo chown root electron/node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 electron/node_modules/electron/dist/chrome-sandbox
      - name: Smoke test Linux Electron GUI
        if: runner.os == 'Linux'
        working-directory: ${{ github.workspace }}
        run: xvfb-run -a env PYTHON_BIN=python scripts/smoke_linux_electron.sh

  node-mcp-test:
    name: Node MCP Test (Linux)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: node-mcp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.13'
          cache: 'npm'
          cache-dependency-path: node-mcp/package-lock.json

      - run: npm ci
      - run: npm test

  python-test:
    name: Python Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: python/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Check Python runtime errors with ruff
        run: ruff check . --select E9,F63,F7,F82

      - name: Type check with pyright
        run: pyright --pythonversion 3.12

      - name: Run tests
        run: pytest -q --tb=short
