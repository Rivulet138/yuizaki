<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: file: https:; font-src 'self' data:; connect-src 'self' http://localhost:* ws://localhost:* http://127.0.0.1:* ws://127.0.0.1:* https://api.openai.com https://api.deepseek.com; media-src 'self' data: blob: file: http://localhost:* http://127.0.0.1:*; worker-src 'self' blob:; object-src 'none'; base-uri 'self';" />
    <link rel="icon" type="image/png" href="./yuizaki-icon.png" />
    <title>結崎 · Yuizaki</title>
    <style>
      @font-face {
        font-family: 'ZenMaruGothic-Medium';
        src: url('/assets/font/ZenMaruGothic-Medium.ttf') format('truetype');
        font-style: normal;
        font-weight: 500;
        font-display: swap;
      }

      @font-face {
        font-family: '萝莉体 第二版';
        src: url('/assets/font/loli.ttf') format('truetype');
        font-style: normal;
        font-weight: 400;
        font-display: swap;
      }

      :root {
        --yui-font-sans: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei UI', 'Noto Sans CJK SC', Roboto, Oxygen, Ubuntu, Cantarell, 'Helvetica Neue', sans-serif;
        --yui-font-display: 'ZenMaruGothic-Medium', '萝莉体 第二版', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        --el-font-size-extra-large: 21px;
        --el-font-size-large: 19px;
        --el-font-size-medium: 17px;
        --el-font-size-base: 15px;
        --el-font-size-small: 14px;
        --el-font-size-extra-small: 13px;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        /* The control panel is also served in a normal browser. A transparent
           document falls back to Chromium's dark canvas while the Vue entry
           chunk is loading, which looks like a stuck black screen. Keep the
           standalone pet window transparent via pet-window.html instead. */
        background-color: #f8fafc;
        user-select: none;
        -webkit-user-select: none;
        font-family: var(--yui-font-sans);
        font-size: 16px;
        font-feature-settings: 'palt' 1;
        text-rendering: optimizeLegibility;
      }

      button,
      input,
      textarea,
      select {
        font-family: var(--yui-font-sans);
      }

      #app {
        width: 100%;
        height: 100%;
        font-family: var(--yui-font-sans);
      }

      #boot-splash {
        display: grid;
        place-items: center;
        width: 100%;
        height: 100%;
        box-sizing: border-box;
        padding: 24px;
        color: #334155;
        background: #f8fafc;
      }

      #boot-splash__content {
        display: grid;
        justify-items: center;
        gap: 12px;
        min-width: 220px;
        padding: 28px 32px;
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        background: #ffffff;
        box-shadow: 0 12px 32px rgba(15, 23, 42, 0.08);
      }

      #boot-splash__mark {
        width: 28px;
        height: 28px;
        border: 3px solid #dbeafe;
        border-top-color: #2563eb;
        border-radius: 50%;
        animation: boot-spin 0.8s linear infinite;
      }

      #boot-splash__label {
        font-size: 14px;
        font-weight: 600;
      }

      @keyframes boot-spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="boot-splash" role="status" aria-live="polite">
        <div id="boot-splash__content">
          <div id="boot-splash__mark" aria-hidden="true"></div>
          <div id="boot-splash__label">正在启动结崎…</div>
        </div>
      </div>
    </div>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
