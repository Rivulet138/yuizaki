services:
  soulx-svc:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SOULX_REF: 81aeb3ae772c70093c3de74dc23c92d983801ae4
    image: yuizaki/soulx-svc:local
    ports:
      - "127.0.0.1:7861:7861"
    environment:
      SOULX_DEVICE: auto
      SOULX_FP16: "true"
      SOULX_TARGET_VOCAL_SEP: "true"
      SOULX_PROMPT_VOCAL_SEP: "false"
      SOULX_AUTO_SHIFT: "true"
      SOULX_STEPS: "32"
      SOULX_CFG: "3.0"
      SOULX_MAX_UPLOAD_BYTES: "52428800"
      SOULX_MAX_STEPS: "128"
    volumes:
      - ./models/SoulX-Singer:/models/SoulX-Singer:ro
      - ./models/SoulX-Singer-Preprocess:/models/SoulX-Singer-Preprocess:ro
      - ./references:/models/references:ro
    # Uncomment when Docker Compose is backed by NVIDIA Container Toolkit.
    # gpus: all
